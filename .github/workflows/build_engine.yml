name: Build Flutter Engine (extra roots)

# Builds a custom-roots libflutter.so and publishes it as a release of this repo
# (tag: engine-<cpu>-<engine_hash>). Public repo => unlimited Actions minutes.
# Only workflow_dispatch: nobody but repo writers can run code here.

run-name: "Build engine-${{ inputs.android_cpu }}-${{ inputs.engine_hash }}"

on:
  workflow_dispatch:
    inputs:
      engine_hash:
        description: "flutter/flutter commit of the engine (bin/internal/engine.version of the app's Flutter version)"
        required: true
        default: "1e9a811bf8e70466596bcf0ea3a8b5adb5f17f7f" # Flutter 3.35.0 / Dart 3.9.0
      android_cpu:
        description: "Android CPU (arm64, arm, x64)"
        required: true
        default: "arm64"
      lto:
        description: "Enable LTO (smaller .so, but the link step is much slower and needs far more RAM)"
        type: boolean
        default: false
      callback_app:
        description: "Optional: after publishing, run Patch App in flutter-custom-ssl for this apps/<name>"
        required: false
        default: ""
      callback_apk_url:
        description: "Optional: APK URL for the Patch App callback (visible in this public repo's run page)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: engine-${{ inputs.android_cpu }}-${{ inputs.engine_hash }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OUT_DIR: android_release_${{ inputs.android_cpu }}
      TAG: engine-${{ inputs.android_cpu }}-${{ inputs.engine_hash }}
    steps:
      # Delete preinstalled toolchains this build never uses. Must run BEFORE the action below,
      # because it measures the free space when it starts. (.NET, Android SDK, Haskell, CodeQL
      # and Docker images are removed by the action itself.)
      - name: Free disk space
        run: |
          df -h / /mnt
          for d in /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
                   /usr/local/share/chromium /usr/share/miniconda /usr/local/lib/node_modules \
                   /usr/local/julia* /opt/az /usr/lib/google-cloud-sdk /usr/local/graalvm \
                   /usr/local/aws-cli /usr/local/aws-sam-cli /opt/microsoft /usr/local/share/vcpkg \
                   /usr/local/n /usr/share/kotlin /usr/local/lib/heroku /usr/lib/firefox \
                   /opt/google /usr/lib/mono; do
            sudo rm -rf $d &
          done
          wait
          sudo apt-get clean || true
          df -h / /mnt

      # Merge / and /mnt into one big volume and drop preinstalled toolchains.
      # Must run before checkout: it re-creates the workspace mount.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - uses: actions/checkout@v4

      # The root disk only keeps a small reserve; send every cache and temp dir to the big volume.
      - name: Put caches and temp files on the big volume
        run: |
          C="$GITHUB_WORKSPACE/.cache"; mkdir -p "$C/tmp"
          {
            echo "TMPDIR=$C/tmp"
            echo "XDG_CACHE_HOME=$C"
            echo "CIPD_CACHE_DIR=$C/cipd"
            echo "VPYTHON_VIRTUALENV_ROOT=$C/vpython"
          } >> "$GITHUB_ENV"
          df -h / "$GITHUB_WORKSPACE"

      - name: Skip if this engine is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists - nothing to build."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
          df -h /home/runner/work

      - name: Validate extra root certificates
        if: steps.exists.outputs.done != 'true'
        run: |
          python3 - <<'PY'
          import re, subprocess
          pem = open("certs/extra_roots.pem").read()
          certs = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", pem, re.S)
          assert certs, "no certificates found"
          for c in certs:
              out = subprocess.run(["openssl", "x509", "-noout", "-fingerprint", "-sha256"],
                                   input=c, text=True, capture_output=True, check=True).stdout
              print(out.strip())
          print(len(certs), "certificates OK")
          PY

      - name: Install build tools
        if: steps.exists.outputs.done != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip ninja-build build-essential pkg-config libfreetype6-dev

      - name: Setup depot_tools
        if: steps.exists.outputs.done != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      # Flutter >= 3.29 keeps the engine inside flutter/flutter; older versions use flutter/engine.
      - name: Detect engine source layout
        if: steps.exists.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H="${{ inputs.engine_hash }}"
          if gh api "repos/flutter/flutter/commits/$H" --jq .sha >/dev/null 2>&1; then
            echo "layout=mono: engine lives in flutter/flutter"
            echo "SRC=$GITHUB_WORKSPACE/work/engine/src" >> "$GITHUB_ENV"
            echo "DART=$GITHUB_WORKSPACE/work/engine/src/flutter/third_party/dart" >> "$GITHUB_ENV"
            echo "GCLIENT_NAME=." >> "$GITHUB_ENV"
            echo "GCLIENT_URL=https://github.com/flutter/flutter.git@$H" >> "$GITHUB_ENV"
          elif gh api "repos/flutter/engine/commits/$H" --jq .sha >/dev/null 2>&1; then
            echo "layout=split: engine lives in flutter/engine"
            echo "SRC=$GITHUB_WORKSPACE/work/src" >> "$GITHUB_ENV"
            echo "DART=$GITHUB_WORKSPACE/work/src/third_party/dart" >> "$GITHUB_ENV"
            echo "GCLIENT_NAME=src/flutter" >> "$GITHUB_ENV"
            echo "GCLIENT_URL=https://github.com/flutter/engine.git@$H" >> "$GITHUB_ENV"
          else
            echo "::error::$H is not a commit of flutter/flutter or flutter/engine - wrong engine hash?"
            exit 1
          fi

      - name: Fetch Flutter engine ${{ inputs.engine_hash }}
        if: steps.exists.outputs.done != 'true'
        run: |
          mkdir work && cd work
          cat > .gclient <<GCLIENT
          solutions = [
            {
              "managed": False,
              "name": "$GCLIENT_NAME",
              "url": "$GCLIENT_URL",
              "custom_deps": {},
              "custom_vars": {"download_fuchsia_deps": False},
              "deps_file": "DEPS",
              "safesync_url": "",
            },
          ]
          GCLIENT
          gclient sync --shallow --no-history -R
          df -h /home/runner/work

      - name: Patch Dart security context
        if: steps.exists.outputs.done != 'true'
        run: |
          test -f "$DART/runtime/bin/security_context_linux.cc"
          python3 tools/patch_security_context.py "$DART" certs/extra_roots.pem

      - name: Build
        if: steps.exists.outputs.done != 'true'
        run: |
          cd "$SRC"
          LTO=--no-lto; [ "${{ inputs.lto }}" = "true" ] && LTO=--lto
          ./flutter/tools/gn --no-goma --android --android-cpu=${{ inputs.android_cpu }} --runtime-mode=release $LTO
          # Heartbeat every 2 minutes: free disk, free memory, swap, load. If the log goes quiet,
          # the last HB line shows whether the machine ran out of memory or disk.
          (
            while true; do
              sleep 120
              echo "HB $(date -u +%T) disk_work=$(df -h --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ') disk_root=$(df -h --output=avail / | tail -1 | tr -d ' ') mem_avail=$(free -m | awk '/Mem/{print $7}')MB swap_used=$(free -m | awk '/Swap/{print $3}')MB load=$(cut -d' ' -f1-3 /proc/loadavg)"
            done
          ) &
          HB=$!
          trap 'kill $HB 2>/dev/null || true' EXIT
          # only libflutter.so, not the whole engine (embedding jars, tests, tools...)
          ninja -j"$(nproc)" -C out/$OUT_DIR flutter/shell/platform/android:flutter_shell_native

      # Keep the unstripped library even if a later step fails, so a packaging bug never costs a rebuild.
      - name: Save unstripped libflutter.so
        if: always() && steps.exists.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libflutter-unstripped-${{ inputs.android_cpu }}-${{ inputs.engine_hash }}
          path: ${{ env.SRC }}/out/${{ env.OUT_DIR }}/libflutter.so
          retention-days: 3
          if-no-files-found: ignore

      - name: Strip and collect
        if: steps.exists.outputs.done != 'true'
        run: |
          cd "$SRC"
          test -f "out/$OUT_DIR/libflutter.so" || { echo "::error::out/$OUT_DIR/libflutter.so was not built"; find out -name 'libflutter*.so' | head; exit 1; }
          # llvm-strip is a symlink in the toolchain, so look for links as well as regular files
          STRIP=$(find . -name llvm-strip \( -type f -o -type l \) | head -1)
          [ -n "$STRIP" ] || STRIP=$(command -v llvm-strip || true)
          test -n "$STRIP" || { echo "::error::no llvm-strip found"; exit 1; }
          echo "strip tool: $STRIP"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "out/$OUT_DIR/libflutter.so" "$GITHUB_WORKSPACE/output/libflutter.so"
          "$STRIP" "$GITHUB_WORKSPACE/output/libflutter.so"
          ls -la "$GITHUB_WORKSPACE/output"

      - name: Disk usage (on failure)
        if: failure()
        run: |
          df -h
          free -m
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -10 || true
          sudo du -xsh /home/runner/* /tmp /var/tmp 2>/dev/null | sort -rh | head -15
          du -sh "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.cache 2>/dev/null | sort -rh | head -15

      - name: Publish release
        if: steps.exists.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="libflutter-${{ inputs.android_cpu }}-${{ inputs.engine_hash }}.so"
          cp output/libflutter.so "$asset"
          gh release create "$TAG" "$asset" \
            --title "libflutter.so (${{ inputs.android_cpu }}, engine ${{ inputs.engine_hash }})" \
            --notes "custom-roots libflutter.so for Flutter engine commit ${{ inputs.engine_hash }} (${{ inputs.android_cpu }}). Built by GitHub Actions."

  # Optional: kick the private Patch App workflow again now that the engine exists.
  # Needs the PATCH_REPO_TOKEN secret (fine-grained PAT, Actions: read/write on israel2176/flutter-custom-ssl).
  callback:
    needs: build
    if: inputs.callback_app != '' && inputs.callback_apk_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Re-run Patch App
        env:
          GH_TOKEN: ${{ secrets.PATCH_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::PATCH_REPO_TOKEN secret is not set"; exit 1; }
          gh workflow run patch_app.yml --repo israel2176/flutter-custom-ssl \
            -f app="${{ inputs.callback_app }}" -f apk_url="${{ inputs.callback_apk_url }}"
